<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier le mot de passe - Bat-Cave Security</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --dark: #0a0e27;
            --darker: #050812;
            --gold: #daa520;
        }

        body {
            background: linear-gradient(135deg, var(--dark) 0%, var(--darker) 100%);
            color: #fff;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .password-container {
            max-width: 520px;
            width: 100%;
            padding: 2rem;
        }

        .password-card {
            background: linear-gradient(135deg, rgba(30,30,60,0.9), rgba(20,20,40,0.9));
            border: 2px solid var(--gold);
            border-radius: 15px;
            padding: 3rem 2rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.7), 0 0 40px rgba(218, 165, 32, 0.2);
        }

        h1 {
            text-align: center;
            font-size: 2rem;
            font-weight: bold;
            color: var(--gold);
            margin-bottom: 2rem;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            color: var(--gold);
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .form-control {
            background: rgba(50,50,80,0.6);
            border: 1px solid var(--gold);
            color: #fff;
            padding: 0.75rem 1rem;
        }

        .form-control:focus {
            background: rgba(60,60,100,0.8);
            border-color: #ffd700;
            color: #fff;
            box-shadow: 0 0 15px rgba(218, 165, 32, 0.3);
        }

        .form-control::placeholder {
            color: rgba(255,255,255,0.5);
        }

        .btn-submit {
            background: linear-gradient(90deg, var(--gold), #ffd700);
            border: none;
            color: #000;
            font-weight: bold;
            padding: 0.75rem 2rem;
            width: 100%;
            border-radius: 8px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .message {
            margin: 1.25rem 0 0;
            text-align: center;
            min-height: 1.5rem;
        }

        .message.error {
            color: #ef4444;
        }

        .back-link {
            display: block;
            margin-top: 1.25rem;
            color: var(--gold);
            text-align: center;
            text-decoration: none;
            font-weight: bold;
        }

        .back-link:hover {
            color: #ffd700;
        }
    </style>
</head>
<body>
    <main class="password-container">
        <section class="password-card">
            <h1>MODIFIER LE MOT DE PASSE</h1>
            <form id="change-password-form">
                <div class="form-group">
                    <label for="current-password" class="form-label">Mot de passe actuel</label>
                    <input type="password" id="current-password" class="form-control" autocomplete="current-password" required>
                </div>
                <div class="form-group">
                    <label for="new-password" class="form-label">Nouveau mot de passe</label>
                    <input type="password" id="new-password" class="form-control" autocomplete="new-password" minlength="12" required>
                </div>
                <div class="form-group">
                    <label for="confirm-password" class="form-label">Confirmer le nouveau mot de passe</label>
                    <input type="password" id="confirm-password" class="form-control" autocomplete="new-password" minlength="12" required>
                </div>
                <button type="submit" class="btn-submit">Modifier le mot de passe</button>
            </form>
            <p id="message" class="message" role="status" aria-live="polite"></p>
            <a class="back-link" href="/bat-computer">Retour au Bat-Computer</a>
        </section>
    </main>
    <script src="/change-password.js"></script>
</body>
</html>
